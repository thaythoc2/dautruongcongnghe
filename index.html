<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đấu Trường Công Nghệ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            max-width: 450px;
            width: 100%;
            text-align: center;
            padding: 35px 25px;
        }
        h1 {
            color: #1e3c72;
            font-size: 24px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        p {
            color: #555;
            font-size: 15px;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .btn-start {
            display: inline-block;
            width: 100%;
            padding: 14px 20px;
            background: #ff7a18;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            border-radius: 8px;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(255, 122, 24, 0.4);
        }
        .btn-start:hover {
            background: #e56910;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Đấu Trường Công Nghệ</h1>
        <p>Chào mừng các em học sinh tham gia sân chơi kiến thức Công nghệ 6,7,8,9! Nhấn vào nút ba chấm ở góc trên bên phải zalo và chọn "Mở bằng trình duyệt", sau đó Nhấn vào nút bên dưới để bắt đầu thử thách.</p>
        <a class="btn-start" href="https://script.google.com/macros/s/AKfycbyNrATiJSEqkg_vU3LhAVjGWf_ct8MJ-xYTEgVNFtEzqQF9AD7HF_-a0e_cT9kdlI6_/exec">BẮT ĐẦU VÀO THI</a>
    </div>

</body>
</html>
