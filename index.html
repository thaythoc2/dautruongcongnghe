<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đấu Trường Công Nghệ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #f0f2f5;
        }
        /* Giao diện khung nhúng cho máy tính */
        #frame-container {
            width: 100%;
            height: 100%;
            display: block;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* Nút hỗ trợ cho điện thoại / trình duyệt Zalo */
        #mobile-notice {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }
        .btn-enter {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 28px;
            background-color: #007bff;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
        }
        .btn-enter:hover {
            background-color: #0056b3;
        }
        .note {
            margin-top: 15px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="mobile-notice">
        <h2>Đấu Trường Công Nghệ</h2>
        <p style="margin-top: 10px; color: #444;">Bấm nút bên dưới để tham gia thử thách ngay:</p>
        <a id="direct-link" class="btn-enter" href="https://script.google.com/macros/s/AKfycbxr3lTGSGzi43V9KjyjwFR1pOssJzxZSkzDXpxM99Lmv7hAIvGW6esf3LeP5uNsyC_w/exec" target="_blank">VÀO ĐẤU TRƯỜNG</a>
        <p class="note">Nếu dùng Zalo, bạn có thể bấm dấu 3 chấm góc trên bên phải và chọn "Mở bằng trình duyệt".</p>
    </div>

    <div id="frame-container">
        <iframe src="https://script.google.com/macros/s/AKfycbxr3lTGSGzi43V9KjyjwFR1pOssJzxZSkzDXpxM99Lmv7hAIvGW6esf3LeP5uNsyC_w/exec" allowfullscreen></iframe>
    </div>

    <script>
        // Kiểm tra nếu mở bằng điện thoại hoặc trong app Zalo
        var userAgent = navigator.userAgent || navigator.vendor || window.opera;
        var isMobile = /android|iphone|ipad|ipod/i.test(userAgent.toLowerCase());
        var isZalo = /zalo/i.test(userAgent.toLowerCase());

        if (isMobile || isZalo) {
            document.getElementById('frame-container').style.display = 'none';
            document.getElementById('mobile-notice').style.display = 'block';
        }
    </script>
</body>
</html>
